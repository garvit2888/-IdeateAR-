<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Links History - IdeateAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #F05545;
            --primary-hover: #E63E3E;
            --bg-color: #FAFAFA;
            --text-color: #2D2D2D;
            --text-muted: #666666;
            --border-color: #E1E1E1;
            --shadow-color: rgba(240, 85, 69, 0.1);
            --card-bg: #FFFFFF;
            --success-color: #4CAF50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .logo {
            margin-bottom: 2rem;
            width: 200px;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 30px var(--shadow-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title-area h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .header-title-area p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-decoration: none;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateX(-3px);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        /* Toolbar filters & search */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem 1rem 2.75rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            background-color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(240, 85, 69, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-chip:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-chip.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        /* History items list/grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .link-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .link-card:hover {
            transform: translateY(-5px);
            background: #FFFFFF;
            border-color: var(--primary-color);
            box-shadow: 0 8px 24px rgba(240, 85, 69, 0.08);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary-color);
            opacity: 0.7;
        }

        .card-header {
            margin-bottom: 1.25rem;
        }

        .item-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .format-badges {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.75rem;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-glb {
            background: rgba(33, 150, 243, 0.1);
            color: #1976D2;
            border: 1px solid rgba(33, 150, 243, 0.2);
        }

        .badge-usdz {
            background: rgba(156, 39, 176, 0.1);
            color: #7B1FA2;
            border: 1px solid rgba(156, 39, 176, 0.2);
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-view {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-view:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-copy {
            background: white;
            color: var(--text-color);
            border: 1.5px solid var(--border-color);
        }

        .btn-copy:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(240, 85, 69, 0.02);
        }

        .btn-copy.copied {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            display: none;
        }

        .empty-state.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .empty-icon {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.05));
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto 1.5rem;
        }

        .empty-state .btn-primary {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .empty-state .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Loading Skeleton */
        .loading-skeleton {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .skeleton-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .skeleton-line {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
        }

        .skeleton-title {
            height: 24px;
            width: 60%;
            margin-bottom: 8px;
        }

        .skeleton-date {
            height: 16px;
            width: 40%;
        }

        .skeleton-badge {
            height: 20px;
            width: 80px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .skeleton-button {
            height: 36px;
            width: 48%;
            border-radius: 8px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1.5rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                width: 100%;
            }

            .filter-chip {
                flex: 1;
                text-align: center;
                padding: 0.5rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <img src="/logo.png" alt="IdeateAR" class="logo" onclick="window.location.href='/'">
    <div class="container">
        <div class="header">
            <div class="header-title-area">
                <h1>AR Viewer History</h1>
                <p>Manage and access previously uploaded WebAR food models</p>
            </div>
            <a href="/upload.html" class="back-btn">
                <span>←</span> Back to Upload
            </a>
        </div>

        <div class="toolbar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by food name...">
            </div>
            <div class="filter-group">
                <button class="filter-chip active" data-filter="all">All Formats</button>
                <button class="filter-chip" data-filter="glb">.GLB (Android/PC)</button>
                <button class="filter-chip" data-filter="usdz">.USDZ (iOS)</button>
                <button class="filter-chip" data-filter="both">Both Formats</button>
            </div>
        </div>

        <!-- Loading View -->
        <div id="loadingView" class="loading-skeleton">
            <div class="skeleton-card">
                <div>
                    <div class="skeleton-line skeleton-title"></div>
                    <div class="skeleton-line skeleton-date"></div>
                    <div class="skeleton-line skeleton-badge"></div>
                </div>
                <div style="display: flex; gap: 4%; width: 100%;">
                    <div class="skeleton-line skeleton-button"></div>
                    <div class="skeleton-line skeleton-button"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div>
                    <div class="skeleton-line skeleton-title"></div>
                    <div class="skeleton-line skeleton-date"></div>
                    <div class="skeleton-line skeleton-badge"></div>
                </div>
                <div style="display: flex; gap: 4%; width: 100%;">
                    <div class="skeleton-line skeleton-button"></div>
                    <div class="skeleton-line skeleton-button"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div>
                    <div class="skeleton-line skeleton-title"></div>
                    <div class="skeleton-line skeleton-date"></div>
                    <div class="skeleton-line skeleton-badge"></div>
                </div>
                <div style="display: flex; gap: 4%; width: 100%;">
                    <div class="skeleton-line skeleton-button"></div>
                    <div class="skeleton-line skeleton-button"></div>
                </div>
            </div>
        </div>

        <!-- Links Grid -->
        <div id="linksGrid" class="links-grid" style="display: none;"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">🍔</div>
            <h3>No AR Links Found</h3>
            <p>You haven't uploaded any 3D menu items yet, or no items match your search filter.</p>
            <a href="/upload.html" class="btn-primary">Upload Your First Model</a>
        </div>
    </div>

    <script>
        let allLinks = [];
        let currentFilter = 'all';
        let searchQuery = '';

        const searchInput = document.getElementById('searchInput');
        const filterChips = document.querySelectorAll('.filter-chip');
        const linksGrid = document.getElementById('linksGrid');
        const emptyState = document.getElementById('emptyState');
        const loadingView = document.getElementById('loadingView');

        // Format date beautifully
        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            } catch (e) {
                return dateString;
            }
        }

        // Copy link to clipboard helper
        function copyLink(btn, link) {
            const absoluteLink = window.location.origin + link;
            navigator.clipboard.writeText(absoluteLink).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = 'Copied! ✓';
                btn.classList.add('copied');
                btn.style.pointerEvents = 'none';

                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                    btn.style.pointerEvents = 'auto';
                }, 2000);
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }

        // Render links based on search and filters
        function renderLinks() {
            linksGrid.innerHTML = '';
            
            const filtered = allLinks.filter(item => {
                // Name filter
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
                
                // Format filter
                let matchesFormat = true;
                if (currentFilter === 'glb') {
                    matchesFormat = !!item.glb && !item.usdz;
                } else if (currentFilter === 'usdz') {
                    matchesFormat = !item.glb && !!item.usdz;
                } else if (currentFilter === 'both') {
                    matchesFormat = !!item.glb && !!item.usdz;
                }

                return matchesSearch && matchesFormat;
            });

            if (filtered.length === 0) {
                linksGrid.style.display = 'none';
                emptyState.classList.add('active');
            } else {
                emptyState.classList.remove('active');
                linksGrid.style.display = 'grid';

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'link-card';

                    // Format badges
                    let badgesHtml = '';
                    if (item.glb) badgesHtml += '<span class="badge badge-glb">.GLB</span>';
                    if (item.usdz) badgesHtml += '<span class="badge badge-usdz">.USDZ</span>';

                    card.innerHTML = `
                        <div class="card-header">
                            <h3 class="item-name" title="${item.name}">${item.name}</h3>
                            <div class="item-date">
                                📅 <span>${formatDate(item.createdAt)}</span>
                            </div>
                            <div class="format-badges">
                                ${badgesHtml}
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-copy" onclick="copyLink(this, '${item.viewerLink}')">Copy Link</button>
                            <a href="${item.viewerLink}" target="_blank" class="action-btn btn-view">View AR</a>
                        </div>
                    `;

                    linksGrid.appendChild(card);
                });
            }
        }

        // Fetch links from backend API
        function fetchLinks() {
            loadingView.style.display = 'grid';
            linksGrid.style.display = 'none';
            emptyState.classList.remove('active');

            fetch('/api/links')
                .then(response => {
                    if (!response.ok) throw new Error('API response not ok');
                    return response.json();
                })
                .then(data => {
                    allLinks = data;
                    loadingView.style.display = 'none';
                    renderLinks();
                })
                .catch(error => {
                    console.error('Error fetching links:', error);
                    loadingView.style.display = 'none';
                    emptyState.querySelector('h3').textContent = 'Error Loading History';
                    emptyState.querySelector('p').textContent = 'Could not retrieve AR history from the server.';
                    emptyState.classList.add('active');
                });
        }

        // Event listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLinks();
        });

        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderLinks();
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchLinks);
    </script>
</body>
</html>
